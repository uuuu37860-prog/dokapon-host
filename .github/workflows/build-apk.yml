name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ยอมรับสัญญา Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: จัดโครงสร้างโปรเจกต์
        run: |
          mkdir -p app/src/main/java/com/bom/dokapon app/src/main/jniLibs/arm64-v8a
          cp app.build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt GameActivity.kt app/src/main/java/com/bom/dokapon/

      - name: ดาวน์โหลดอีมูเลเตอร์ PCSX ReARMed (arm64)
        run: |
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          ls -l core_tmp
          mv core_tmp/pcsx_rearmed_libretro_android.so app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro_android.so
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: เก็บไฟล์ APK
        uses: actions/upload-artifact@v4
        with:
          name: dokapon-host-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: ปล่อยเป็น Release (โหลดตรงจากมือถือได้)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dokapon Host build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
